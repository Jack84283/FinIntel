name: Bootstrap CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        run: python -m pip install -e './backend[dev]'
      - name: Python lint
        run: |
          ruff check backend scripts/preserve_local_data.py scripts/daily_acquisition_acceptance.py scripts/quality_acceptance.py scripts/issue29_private_evidence.py
          ruff format --diff backend scripts/preserve_local_data.py scripts/daily_acquisition_acceptance.py scripts/quality_acceptance.py scripts/issue29_private_evidence.py
          ruff format --check backend scripts/preserve_local_data.py scripts/daily_acquisition_acceptance.py scripts/quality_acceptance.py scripts/issue29_private_evidence.py
      - name: Unit tests
        run: python -m pytest backend/tests -q
      - name: Generate disposable Issue 29 acceptance evidence
        run: |
          mkdir -p artifacts
          python scripts/quality_acceptance.py --output artifacts/quality-acceptance.json
      - name: Archive redacted synthetic acceptance evidence
        uses: actions/upload-artifact@v4
        with:
          name: finintel-issue29-synthetic-acceptance
          path: artifacts/quality-acceptance.json
          if-no-files-found: error
          retention-days: 14

  frontend:
    name: Frontend / React
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test
      - name: Build frontend
        run: npm run build

  tauri-native:
    name: Native / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build native Python sidecar
        run: |
          python -m pip install -e './backend[dev]' pyinstaller
          python scripts/build_sidecar.py
      - name: Smoke test packaged local backend
        run: python scripts/smoke_sidecar.py
      - name: Install JavaScript dependencies
        run: npm ci --no-audit --no-fund
      - name: Build frontend assets
        run: npm run build
      - name: Check native Rust shell
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Run native overlap Unicode unit tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --bin finintel overlap_search_tests
      - name: Run native model-job contract tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --bin finintel model_jobs::tests
      - name: Package macOS app bundle
        if: runner.os == 'macOS'
        run: npm run tauri:build --workspace @finintel/desktop -- --bundles app
      - name: Package Windows installer
        if: runner.os == 'Windows'
        run: npm run tauri:build --workspace @finintel/desktop -- --bundles nsis
      - name: Package Linux DEB
        if: runner.os == 'Linux'
        run: npm run tauri:build --workspace @finintel/desktop -- --bundles deb
